[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[rpc_endpoints]
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood_mainnet = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
